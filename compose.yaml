services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_voluntario}
      POSTGRES_USER: ${POSTGRES_USER:-portal_voluntario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_voluntario_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal_voluntario} -d ${POSTGRES_DB:-portal_voluntario}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
