spring.application.name=portal-voluntario

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_voluntario}
spring.datasource.username=${DB_USERNAME:portal_voluntario}
spring.datasource.password=${DB_PASSWORD:portal_voluntario_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema é criado e versionado exclusivamente pelas migrações Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

security.jwt.issuer=${JWT_ISSUER:portal-voluntario}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@portal-voluntario.local}
