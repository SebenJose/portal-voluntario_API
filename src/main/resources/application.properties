spring.application.name=portal-voluntario

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_voluntario}
spring.datasource.username=${DB_USERNAME:portal_voluntario}
spring.datasource.password=${DB_PASSWORD:portal_voluntario_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema é criado e versionado exclusivamente pelas migrações Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

security.jwt.issuer=${JWT_ISSUER:portal-voluntario}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@portal-voluntario.local}

# Opt-in only. Remove the bootstrap variables after creating the first administrator.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.nome=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}

app.storage.directory=${DOCUMENT_STORAGE_DIR:.local-data/documentos}
app.storage.max-user-bytes=${DOCUMENT_MAX_USER_BYTES:104857600}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Documentação gerada a partir dos controllers e DTOs da API.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/v1/**
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
